<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- =====================================================
         VIEWPORT
    ====================================================== -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- =====================================================
         BASIC SEO
    ====================================================== -->
    <title>VEYRA — Travel Beyond the Familiar</title>

    <meta
      name="description"
      content="Discover extraordinary destinations and shape personalized journeys around the way you want to travel with VEYRA."
    />

    <meta
      name="keywords"
      content="VEYRA, travel, travel planner, trip planner, destinations, personalized journeys, luxury travel, travel inspiration"
    />

    <meta name="author" content="Harsh Shukla" />

    <!-- =====================================================
         FAVICON
    ====================================================== -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- =====================================================
         BROWSER / THEME
    ====================================================== -->
    <meta name="theme-color" content="#080808" />
    <meta name="color-scheme" content="dark" />

    <!-- =====================================================
         OPEN GRAPH
         WhatsApp / LinkedIn / Facebook / Discord / etc.
    ====================================================== -->
    <meta property="og:type" content="website" />

    <meta
      property="og:site_name"
      content="VEYRA"
    />

    <meta
      property="og:title"
      content="VEYRA — Travel Beyond the Familiar"
    />

    <meta
      property="og:description"
      content="Discover extraordinary destinations and shape personalized journeys around the way you want to travel."
    />

    <meta
      property="og:image"
      content="/images/og-image.jpg"
    />

    <meta
      property="og:image:type"
      content="image/jpeg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="VEYRA — Travel Beyond the Familiar"
    />

    <!-- =====================================================
         X / TWITTER PREVIEW
    ====================================================== -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="VEYRA — Travel Beyond the Familiar"
    />

    <meta
      name="twitter:description"
      content="Discover extraordinary destinations and shape personalized journeys around the way you want to travel."
    />

    <meta
      name="twitter:image"
      content="/images/og-image.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="VEYRA — Travel Beyond the Familiar"
    />

    <!-- =====================================================
         PERFORMANCE
    ====================================================== -->
    <link
      rel="preconnect"
      href="https://images.unsplash.com"
      crossorigin
    />

    <link
      rel="dns-prefetch"
      href="https://images.unsplash.com"
    />

    <!-- =====================================================
         VEYRA APP
    ====================================================== -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </head>

  <body>
    <noscript>
      VEYRA requires JavaScript to run this travel experience.
    </noscript>

    <div id="root"></div>
  </body>
</html>
